name: Build & Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Create a GitHub Release with the built jars'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Collect release jars (all enabled platforms)
        run: |
          mkdir -p release-jars
          PLATFORMS=$(grep '^enabled_platforms=' gradle.properties | cut -d= -f2 | tr ',' ' ')
          echo "Enabled platforms: $PLATFORMS"
          for p in $PLATFORMS; do
            if [ -d "$p/build/libs" ]; then
              rm -f "$p"/build/libs/*-dev*.jar "$p"/build/libs/*-sources*.jar
              cp -v "$p"/build/libs/*.jar release-jars/ || true
            fi
          done
          echo "Jars selected for release:"
          ls -l release-jars

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZlCosmetics-jars-${{ github.run_number }}
          path: release-jars/*.jar
          if-no-files-found: error

      - name: Read versions
        id: versions
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.make_release) }}
        run: |
          echo "mod=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.make_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-mc{1}', steps.versions.outputs.mod, steps.versions.outputs.mc) }}
          name: ZlCosmetics v${{ steps.versions.outputs.mod }} for Minecraft ${{ steps.versions.outputs.mc }}
          body: |
            Automated build of **ZlCosmetics** for Minecraft **${{ steps.versions.outputs.mc }}** (commit ${{ github.sha }})

            ## Downloads
            - `zlcosmetics-fabric-*.jar` — **Fabric** (Fabric Loader + Fabric API)
            - `zlcosmetics-forge-*.jar` — **Forge** (not built for every version)
            - `zlcosmetics-neoforge-*.jar` — **NeoForge** (1.21.1 and newer)

            Built by GitHub Actions from branch: `${{ github.ref_name }}`
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-jars/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
