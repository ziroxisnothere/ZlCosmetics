name: Build & Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Create a GitHub Release with the built jars'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Collect release jars (fabric + forge)
        run: |
          mkdir -p release-jars
          rm -f fabric/build/libs/*-dev*.jar fabric/build/libs/*-sources*.jar
          rm -f forge/build/libs/*-dev*.jar forge/build/libs/*-sources*.jar
          cp -v fabric/build/libs/*.jar release-jars/ || true
          cp -v forge/build/libs/*.jar release-jars/ || true
          echo "Jars selected for release:"
          ls -l release-jars

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZlCosmetics-jars-${{ github.run_number }}
          path: release-jars/*.jar
          if-no-files-found: error

      - name: Read mod version
        id: mod_version
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.make_release) }}
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.make_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.mod_version.outputs.version) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.mod_version.outputs.version) }}
          body: |
            Automated build of **ZlCosmetics** for Minecraft **1.16.5** (commit ${{ github.sha }})

            ## Downloads
            - `cosmetica-fabric-*.jar` — **Fabric** (Fabric Loader + Fabric API)
            - `cosmetica-forge-*.jar` — **Forge**

            Built by GitHub Actions from branch/tag: `${{ github.ref_name }}`
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-jars/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
